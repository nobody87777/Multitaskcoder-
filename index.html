<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultitaskCoder - Learn. Build. Master.</title>
    <meta name="description" content="MultitaskCoder is an all-in-one platform to learn programming theory, practice speed typing, debug code, and take quizzes across Python, Java, and C.">
    <meta name="theme-color" content="#7c3aed">
    <link rel="canonical" href="https://nobody87777.github.io/Multitaskcoder-/">
    <meta name="robots" content="index, follow">

    <!-- Favicons & App Icons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">

    <!-- Open Graph & Social Sharing -->
    <meta property="og:title" content="MultitaskCoder - Learn. Build. Master.">
    <meta property="og:description" content="All-in-one programming platform to learn theory, practice speed typing, debug broken code, and take quizzes across Python, Java, and C.">
    <meta property="og:url" content="https://nobody87777.github.io/Multitaskcoder-/">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://nobody87777.github.io/Multitaskcoder-/assets/icons/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="MultitaskCoder - Learn. Build. Master.">
    <meta name="twitter:description" content="All-in-one programming platform to learn theory, practice speed typing, debug broken code, and take quizzes across Python, Java, and C.">
    <meta name="twitter:image" content="https://nobody87777.github.io/Multitaskcoder-/assets/icons/icon-512.png">

    <link rel="manifest" href="manifest.webmanifest">

    <!-- Instant Theme Restoration (Avoids FOUC) -->
    <script>
        try {
            if (localStorage.getItem("mtc_theme") === "light") {
                document.documentElement.classList.remove("dark");
            }
        } catch (e) {}
    </script>


    <!-- Three.js for 3D Loading Simulation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS Architecture -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/themes.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="dark min-h-screen pb-32 selection:bg-purple-600 selection:text-white">

    <!-- Application root. Rendered by js/app.js -->
    <div id="app"></div>

    <!-- Module Script Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
